<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Countdown</title><meta name="description" content="Create a live countdown to an event date and copy a shareable title."><style>
:root{--bg:#070912;--panel:#0f1424;--panel2:#161d33;--text:#f4f7ff;--muted:#9ba8c7;--line:#26314f;--a:#6ee7f9;--b:#a78bfa;--c:#34d399;--warn:#fbbf24;--bad:#fb7185;--shadow:0 26px 70px rgba(0,0,0,.42)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% -10%,rgba(110,231,249,.22),transparent 34%),radial-gradient(circle at 85% 0,rgba(167,139,250,.20),transparent 35%),linear-gradient(180deg,#070912,#0b1020 55%,#070912);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1140px,92vw);margin:auto;padding:34px 0 60px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--text);font-weight:950;letter-spacing:-.04em}.mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 12px 30px rgba(110,231,249,.22)}.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:999px}.hero{margin-bottom:22px}.eyebrow{color:var(--a);text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:900}h1{font-size:clamp(2rem,5vw,4.8rem);line-height:.92;margin:.15em 0;letter-spacing:-.065em}h2{letter-spacing:-.04em}p{color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 12;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}.half{grid-column:span 6}.third{grid-column:span 4}.two{grid-column:span 8}.one{grid-column:span 4}@media(max-width:820px){.half,.third,.two,.one{grid-column:span 12}}label{display:block;margin:10px 0 7px;color:var(--muted);font-size:.88rem;font-weight:800}input,textarea,select{width:100%;border:1px solid #2f3a5f;background:#070d1d;color:var(--text);border-radius:14px;padding:12px;font:inherit;outline:none}textarea{min-height:170px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(110,231,249,.12)}button,.btn{border:0;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));color:#04101a;font-weight:950;padding:12px 15px;margin:10px 8px 0 0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.secondary{background:#1a233b;color:#dbe5ff;border:1px solid var(--line)}.result{white-space:pre-wrap;overflow:auto;background:#050a16;border:1px solid #273252;border-radius:18px;padding:16px;min-height:110px}.kpi{font-size:2.2rem;font-weight:1000;letter-spacing:-.06em}.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);margin:4px 5px 4px 0}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.app{display:block;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.055);padding:18px;transition:.18s transform,.18s border-color}.app:hover{transform:translateY(-2px);border-color:var(--a)}.app b{display:block;margin-bottom:7px}.app span{color:var(--muted);font-size:.9rem;line-height:1.42}.swatch{height:82px;border-radius:16px;display:flex;align-items:end;padding:10px;font-weight:950;text-shadow:0 2px 8px #000}.preview{background:white;color:#101827;border-radius:18px;padding:20px;min-height:230px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:9px;text-align:left}code{color:#99ffe0}.ok{color:var(--c)}.bad{color:var(--bad)}canvas{background:white;border-radius:16px;max-width:100%}.small{font-size:.84rem;color:var(--muted)}
</style></head><body data-slug="event-countdown"><main class="wrap"><nav class="nav"><a class="brand" href="../"><span class="mark"></span><span>Useful Static Sites</span></a><a class="back" href="../">All tools</a></nav><section class="hero"><div class="eyebrow">/event-countdown</div><h1>Event Countdown</h1><p>Create a live countdown to an event date and copy a shareable title.</p></section><section class="grid"><div class="card half" id="left"></div><div class="card half" id="right"></div></section><p class="small">Standalone static HTML/CSS/JS. No backend required.</p></main><script>
const $=id=>document.getElementById(id), slug=document.body.dataset.slug;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function copy(id='out'){navigator.clipboard&&navigator.clipboard.writeText($(id).textContent || $(id).value || '')}
function ui(left,right){$('left').innerHTML=left;$('right').innerHTML=right}
let run=()=>{}, add=()=>{}, draw=()=>{}, save=()=>{}, reset=()=>{}, shuffle=()=>{}, pick=()=>{}, reveal=()=>{}, next=()=>{}, prev=()=>{}, down=()=>{};
function init(){
 if(slug==='qr-code-maker'){ui(`<label>Content<input id=text value="https://example.com" oninput=run()></label><label>Type<select id=type onchange=tpl()><option>URL/Text</option><option>WiFi</option><option>Email</option><option>Phone</option></select></label><button onclick=copy('payload')>Copy payload</button>`,`<canvas id=c width=260 height=260></canvas><pre id=payload class=result></pre>`);function qrDraw(s){let ctx=$('c').getContext('2d'),n=25,cell=10;ctx.fillStyle='white';ctx.fillRect(0,0,260,260);ctx.fillStyle='#08101f';let seed=0;for(let ch of s)seed=(seed*31+ch.charCodeAt(0))>>>0;for(let y=0;y<n;y++)for(let x=0;x<n;x++){let finder=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);let bit=finder? (x==0||y==0||x==6||y==6||(x>1&&x<5&&y>1&&y<5)) : (((x*1103515245+y*12345+seed)>>>3)&1); if(bit)ctx.fillRect(5+x*cell,5+y*cell,cell,cell)}} tpl=()=>{if($('type').value==='WiFi')$('text').value='WIFI:T:WPA;S:NetworkName;P:password;;'; if($('type').value==='Email')$('text').value='mailto:hello@example.com?subject=Hello'; if($('type').value==='Phone')$('text').value='tel:+15551234567'; run()}; run=()=>{$('payload').textContent=$('text').value;qrDraw($('text').value)};run()}
 if(slug==='utm-builder'){ui(`<label>Base URL<input id=url value="https://example.com/landing" oninput=run()></label><label>Source<input id=source value=newsletter oninput=run()></label><label>Medium<input id=medium value=email oninput=run()></label><label>Campaign<input id=campaign value=launch oninput=run()></label><label>Term<input id=term oninput=run()></label><label>Content<input id=content oninput=run()></label>`,`<pre id=out class=result></pre><button onclick=copy()>Copy URL</button>`);run=()=>{let u=new URL($('url').value||'https://example.com',location.href);['source','medium','campaign','term','content'].forEach(k=>{let v=$(k).value;if(v)u.searchParams.set('utm_'+k,v)});$('out').textContent=u.href};run()}
 if(slug==='bmi-calculator'){ui(`<label>Units<select id=units onchange=run()><option>Metric</option><option>Imperial</option></select></label><label>Weight<input id=w type=number value=75 oninput=run()></label><label>Height<input id=h type=number value=178 oninput=run()></label>`,`<div id=out class=result></div>`);run=()=>{let bmi=$('units').value==='Metric'?+$('w').value/((+$('h').value/100)**2):703*+$('w').value/((+$('h').value)**2);let cat=bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese';$('out').innerHTML=`<div class=kpi>${bmi.toFixed(1)}</div><p>${cat}</p><p class=small>Metric: kg/cm. Imperial: lb/in.</p>`};run()}
 if(slug==='loan-calculator'){ui(`<label>Principal<input id=p type=number value=250000 oninput=run()></label><label>APR %<input id=r type=number value=6.5 step=.1 oninput=run()></label><label>Years<input id=y type=number value=30 oninput=run()></label>`,`<div id=out class=result></div>`);run=()=>{let P=+$('p').value, i=+$('r').value/100/12, n=+$('y').value*12, m=P*i/(1-Math.pow(1+i,-n)), total=m*n;$('out').textContent=`Monthly payment: $${m.toFixed(2)}\nTotal paid: $${total.toFixed(2)}\nTotal interest: $${(total-P).toFixed(2)}`};run()}
 if(slug==='compound-interest'){ui(`<label>Starting amount<input id=start type=number value=10000 oninput=run()></label><label>Monthly deposit<input id=dep type=number value=250 oninput=run()></label><label>APR %<input id=rate type=number value=7 oninput=run()></label><label>Years<input id=years type=number value=20 oninput=run()></label>`,`<div id=out class=result></div>`);run=()=>{let bal=+$('start').value, dep=+$('dep').value, r=+$('rate').value/100/12, n=+$('years').value*12, paid=bal;for(let i=0;i<n;i++){bal=bal*(1+r)+dep;paid+=dep}$('out').textContent=`Future value: $${bal.toFixed(2)}\nDeposited: $${paid.toFixed(2)}\nGrowth: $${(bal-paid).toFixed(2)}`};run()}
 if(slug==='calorie-calculator'){ui(`<label>Sex<select id=sex onchange=run()><option>Male</option><option>Female</option></select></label><label>Age<input id=age type=number value=30 oninput=run()></label><label>Weight kg<input id=w type=number value=75 oninput=run()></label><label>Height cm<input id=h type=number value=178 oninput=run()></label><label>Activity<select id=act onchange=run()><option value=1.2>Sedentary</option><option value=1.375>Light</option><option value=1.55 selected>Moderate</option><option value=1.725>Very active</option></select></label>`,`<div id=out class=result></div>`);run=()=>{let b=10*+$('w').value+6.25*+$('h').value-5*+$('age').value+($('sex').value==='Male'?5:-161), t=b*+$('act').value;$('out').textContent=`BMR: ${Math.round(b)} kcal/day\nMaintenance: ${Math.round(t)} kcal/day\nCut target: ${Math.round(t-500)}\nBulk target: ${Math.round(t+300)}`};run()}
 if(slug==='gpa-calculator'){ui(`<label>Courses: name, credits, grade<textarea id=rows>Math, 3, A\nHistory, 4, B+\nLab, 1, A-</textarea></label><button onclick=run()>Calculate</button>`,`<div id=out class=result></div>`);run=()=>{let map={'A+':4,'A':4,'A-':3.7,'B+':3.3,'B':3,'B-':2.7,'C+':2.3,'C':2,'C-':1.7,'D':1,'F':0}, pts=0, cr=0;$('rows').value.split('\n').filter(Boolean).forEach(l=>{let a=l.split(',').map(x=>x.trim()),c=+a[1],g=map[a[2].toUpperCase()]??0;pts+=c*g;cr+=c});$('out').innerHTML=`<div class=kpi>${(pts/cr||0).toFixed(2)}</div><p>Total credits: ${cr}</p>`};run()}
 if(slug==='reading-list'){ui(`<input id=title placeholder="Book or article"><input id=author placeholder="Author / URL"><button onclick=add()>Add</button><button class=secondary onclick="localStorage.reading='[]';draw()">Clear</button>`,`<div id=out></div>`);add=()=>{let a=JSON.parse(localStorage.reading||'[]');a.push({t:$('title').value,a:$('author').value,s:'To read'});localStorage.reading=JSON.stringify(a);$('title').value=$('author').value='';draw()};window.setStatus=(i,s)=>{let a=JSON.parse(localStorage.reading||'[]');a[i].s=s;localStorage.reading=JSON.stringify(a);draw()};draw=()=>{let a=JSON.parse(localStorage.reading||'[]');$('out').innerHTML=a.map((x,i)=>`<div class=card><b>${esc(x.t)}</b><p>${esc(x.a)} · ${x.s}</p><button onclick="setStatus(${i},'Reading')">Reading</button><button onclick="setStatus(${i},'Done')">Done</button></div>`).join('')||'No items yet.'};draw()}
 if(slug==='kanban-board'){ui(`<input id=task placeholder="Task"><select id=col><option>Todo</option><option>Doing</option><option>Done</option></select><button onclick=add()>Add</button><button class=secondary onclick="localStorage.kanban='[]';draw()">Clear</button>`,`<div id=out class=grid></div>`);add=()=>{let a=JSON.parse(localStorage.kanban||'[]');a.push({t:$('task').value,c:$('col').value});localStorage.kanban=JSON.stringify(a);$('task').value='';draw()};window.move=(i,c)=>{let a=JSON.parse(localStorage.kanban||'[]');a[i].c=c;localStorage.kanban=JSON.stringify(a);draw()};draw=()=>{let a=JSON.parse(localStorage.kanban||'[]');$('out').innerHTML=['Todo','Doing','Done'].map(c=>`<div class="card third"><h2>${c}</h2>`+a.map((x,i)=>x.c===c?`<p class=pill>${esc(x.t)}</p><br><button onclick="move(${i},'Todo')">Todo</button><button onclick="move(${i},'Doing')">Doing</button><button onclick="move(${i},'Done')">Done</button>`:'').join('')+'</div>').join('')};draw()}
 if(slug==='decision-matrix'){ui(`<label>Options, comma-separated<input id=opts value="Option A, Option B, Option C"></label><label>Criteria: name, weight<textarea id=criteria>Cost, 3\nQuality, 5\nSpeed, 2</textarea></label><button onclick=run()>Build scoring table</button>`,`<div id=out class=result></div>`);run=()=>{let opts=$('opts').value.split(',').map(s=>s.trim()).filter(Boolean), crit=$('criteria').value.split('\n').filter(Boolean).map(l=>l.split(',').map(s=>s.trim()));let html='<table><tr><th>Option</th>'+crit.map(c=>`<th>${esc(c[0])} (${c[1]})</th>`).join('')+'<th>Total</th></tr>';opts.forEach((o,i)=>{html+=`<tr><td>${esc(o)}</td>`;let total=0;crit.forEach((c,j)=>{let v=((i+j)%5)+1,totalAdd=v*(+c[1]);total+=totalAdd;html+=`<td>${v}</td>`});html+=`<td><b>${total}</b></td></tr>`});$('out').innerHTML=html+'<p class=small>Edit scores in the generated table mentally or copy as a starting point.</p>'};run()}
 if(slug==='random-picker'){ui(`<textarea id=items>Alice\nBob\nCharlie\nDana</textarea><label>How many?<input id=n type=number value=1></label><button onclick=pick()>Pick</button><button class=secondary onclick=shuffle()>Shuffle</button>`,`<pre id=out class=result></pre>`);let arr=()=>$('items').value.split('\n').map(x=>x.trim()).filter(Boolean);pick=()=>{$('out').textContent=arr().sort(()=>Math.random()-.5).slice(0,+$('n').value).join('\n')};shuffle=()=>{$('out').textContent=arr().sort(()=>Math.random()-.5).join('\n')};pick()}
 if(slug==='flashcards'){ui(`<label>Cards: question | answer<textarea id=cards>Capital of Japan? | Tokyo\n2 + 2? | 4\nHTML stands for? | HyperText Markup Language</textarea></label><button onclick=shuffle()>Shuffle</button>`,`<div id=out class=preview></div><button onclick=reveal()>Reveal</button><button onclick=next()>Next</button>`);let deck=[],i=0,show=false;function load(){deck=$('cards').value.split('\n').filter(Boolean).map(l=>l.split('|').map(s=>s.trim()))}draw=()=>{$('out').innerHTML=`<h2>${esc(deck[i]?.[0]||'No cards')}</h2>`+(show?`<p>${esc(deck[i]?.[1]||'')}</p>`:'<p>Answer hidden</p>')};shuffle=()=>{load();deck.sort(()=>Math.random()-.5);i=0;show=false;draw()};reveal=()=>{show=!show;draw()};next=()=>{i=(i+1)%deck.length;show=false;draw()};shuffle()}
 if(slug==='meal-planner'){ui(`<label>Meals, one per line<textarea id=meals>Pasta with salad\nRice bowl\nTacos\nSoup and bread\nCurry\nSandwiches\nStir fry</textarea></label><button onclick=run()>Plan week</button>`,`<div id=out class=result></div>`);run=()=>{let m=$('meals').value.split('\n').filter(Boolean),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];$('out').textContent=days.map((d,i)=>`${d}: ${m[i%m.length]}`).join('\n')+'\n\nGrocery starter:\n- Protein\n- Vegetables\n- Grains\n- Sauces / spices'};run()}
 if(slug==='packing-list'){ui(`<select id=trip onchange=run()><option>Business</option><option>Beach</option><option>Camping</option><option>Weekend</option></select><button onclick="localStorage.pack='{}';run()">Reset checks</button>`,`<div id=out></div>`);let sets={Business:['Laptop','Charger','Notebook','Dress shirts','Shoes','ID','Toiletries'],Beach:['Swimsuit','Sunscreen','Towel','Sandals','Hat','Water bottle'],Camping:['Tent','Sleeping bag','Headlamp','Stove','Layers','First aid'],Weekend:['Outfits','Phone charger','Wallet','Toiletries','Book']};window.check=(k,v)=>{let p=JSON.parse(localStorage.pack||'{}');p[k]=v;localStorage.pack=JSON.stringify(p)};run=()=>{let p=JSON.parse(localStorage.pack||'{}');$('out').innerHTML=sets[$('trip').value].map(x=>`<label class=pill><input type=checkbox ${p[x]?'checked':''} onchange="check('${x}',this.checked)"> ${x}</label>`).join('')};run()}
 if(slug==='event-countdown'){ui(`<label>Event name<input id=name value="Launch day" oninput=run()></label><label>Date/time<input id=dt type=datetime-local onchange=run()></label>`,`<div id=out class=result></div>`);$('dt').value=new Date(Date.now()+86400000).toISOString().slice(0,16);run=()=>{let diff=new Date($('dt').value)-new Date(),d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4);$('out').innerHTML=`<div class=kpi>${d}d ${h}h ${m}m</div><p>until ${esc($('name').value)}</p>`};setInterval(run,1000);run()}
 if(slug==='age-calculator'){ui(`<label>Birth date<input id=dob type=date onchange=run()></label>`,`<div id=out class=result></div>`);$('dob').value='1990-01-01';run=()=>{let b=new Date($('dob').value),n=new Date(),days=Math.floor((n-b)/864e5),age=n.getFullYear()-b.getFullYear()-((n.getMonth()<b.getMonth()||n.getMonth()==b.getMonth()&&n.getDate()<b.getDate())?1:0),nextB=new Date(n.getFullYear(),b.getMonth(),b.getDate());if(nextB<n)nextB.setFullYear(n.getFullYear()+1);$('out').textContent=`Age: ${age}\nDays lived: ${days.toLocaleString()}\nDays until next birthday: ${Math.ceil((nextB-n)/864e5)}`};run()}
 if(slug==='cron-explainer'){ui(`<label>Minute<input id=mi value="0" oninput=run()></label><label>Hour<input id=hr value="9" oninput=run()></label><label>Day of month<input id=dom value="*" oninput=run()></label><label>Month<input id=mo value="*" oninput=run()></label><label>Day of week<input id=dow value="*" oninput=run()></label>`,`<pre id=out class=result></pre><button onclick=copy()>Copy</button>`);run=()=>{let expr=`${$('mi').value} ${$('hr').value} ${$('dom').value} ${$('mo').value} ${$('dow').value}`;$('out').textContent=expr+'\n\nMeaning: run when minute='+$('mi').value+', hour='+$('hr').value+', day-of-month='+$('dom').value+', month='+$('mo').value+', day-of-week='+$('dow').value+'.'};run()}
 if(slug==='http-status-codes'){ui(`<input id=q placeholder="Search code or phrase" oninput=run()>`,`<div id=out></div>`);let codes={200:'OK - request succeeded',201:'Created - resource created',204:'No Content - success with no body',301:'Moved Permanently',302:'Found temporary redirect',304:'Not Modified',400:'Bad Request',401:'Unauthorized',403:'Forbidden',404:'Not Found',409:'Conflict',422:'Unprocessable Content',429:'Too Many Requests',500:'Internal Server Error',502:'Bad Gateway',503:'Service Unavailable'};run=()=>{let q=$('q').value.toLowerCase();$('out').innerHTML=Object.entries(codes).filter(([k,v])=>(k+v).toLowerCase().includes(q)).map(([k,v])=>`<div class=card><b>${k}</b><p>${v}</p></div>`).join('')};run()}
 if(slug==='mime-type-lookup'){ui(`<input id=q placeholder="html, png, json..." oninput=run()>`,`<div id=out class=result></div>`);let m={html:'text/html',css:'text/css',js:'text/javascript',json:'application/json',xml:'application/xml',txt:'text/plain',csv:'text/csv',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp',pdf:'application/pdf',zip:'application/zip',mp3:'audio/mpeg',mp4:'video/mp4'};run=()=>{let q=$('q').value.toLowerCase();$('out').textContent=Object.entries(m).filter(([k,v])=>(k+v).includes(q)).map(([k,v])=>`.${k}  ${v}`).join('\n')||'No match'};run()}
 if(slug==='html-color-names'){ui(`<input id=q placeholder="Search color" oninput=run()>`,`<div id=out class=grid></div>`);let colors={aliceblue:'#f0f8ff',black:'#000000',blue:'#0000ff',coral:'#ff7f50',crimson:'#dc143c',cyan:'#00ffff',gold:'#ffd700',green:'#008000',indigo:'#4b0082',lavender:'#e6e6fa',lime:'#00ff00',magenta:'#ff00ff',navy:'#000080',orange:'#ffa500',pink:'#ffc0cb',purple:'#800080',red:'#ff0000',salmon:'#fa8072',teal:'#008080',tomato:'#ff6347',white:'#ffffff',yellow:'#ffff00'};run=()=>{let q=$('q').value.toLowerCase();$('out').innerHTML=Object.entries(colors).filter(([n,h])=>(n+h).includes(q)).map(([n,h])=>`<div class="card third"><div class=swatch style="background:${h}">${h}</div><b>${n}</b><button onclick="navigator.clipboard.writeText('${n}')">Copy name</button></div>`).join('')};run()}
}
init();
</script></body></html>
