<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro Timer</title><meta name="description" content="Run configurable focus and break timers."><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#263b88,transparent 35%),radial-gradient(circle at 90% 5%,#0e8f73,transparent 30%),#090d1b;color:#eef3ff;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif}.wrap{width:min(1120px,92vw);margin:auto;padding:34px 0 58px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{color:white;text-decoration:none;font-weight:900;letter-spacing:-.03em}.back{color:#aebce0;text-decoration:none;border:1px solid #2d3b65;border-radius:999px;padding:9px 13px}.hero{margin-bottom:20px}.eyebrow{color:#30e0ae;text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:900}h1{font-size:clamp(2rem,5vw,4.5rem);line-height:.94;margin:.2em 0;letter-spacing:-.06em}p{color:#aebce0;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 12;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid #26365f;border-radius:24px;padding:20px;box-shadow:0 24px 60px #0007}.half{grid-column:span 6}.third{grid-column:span 4}@media(max-width:800px){.half,.third{grid-column:span 12}}label{display:block;margin:9px 0 6px;color:#aebce0;font-weight:700;font-size:.88rem}input,textarea,select{width:100%;border:1px solid #2f416e;border-radius:14px;background:#081025;color:#eef3ff;font:inherit;padding:12px}textarea{min-height:180px}button{border:0;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#a176ff);color:white;font-weight:900;padding:12px 16px;margin:10px 8px 0 0;cursor:pointer}.secondary{background:#1a2546}.result{white-space:pre-wrap;overflow:auto;background:#060b1a;border:1px solid #283862;border-radius:18px;padding:16px;min-height:110px}.kpi{font-size:2rem;font-weight:950}.swatch{height:110px;border-radius:16px;padding:10px;display:flex;align-items:end;font-weight:900;text-shadow:0 2px 8px #000}.preview{background:white;color:#111827;border-radius:18px;padding:20px;min-height:240px}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.app{color:white;text-decoration:none;border:1px solid #26365f;border-radius:20px;background:#ffffff0b;padding:18px}.app b{display:block;margin-bottom:6px}.app span{color:#aebce0;font-size:.9rem}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #293961;padding:9px;text-align:left}code{color:#94ffd6}canvas{background:white;border-radius:16px;max-width:100%}</style></head><body data-slug="pomodoro-timer"><main class="wrap"><nav class="nav"><a class="brand" href="../">Useful Static Sites</a><a class="back" href="../">All tools</a></nav><section class="hero"><div class="eyebrow">/pomodoro-timer</div><h1>Pomodoro Timer</h1><p>Run configurable focus and break timers.</p></section><section class="grid"><div class="card half" id="left"></div><div class="card half" id="right"></div></section><p>Standalone static HTML/CSS/JS. No backend required.</p></main><script>
const $=id=>document.getElementById(id), slug=document.body.dataset.slug;
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function copy(id='out'){navigator.clipboard&&navigator.clipboard.writeText($(id).textContent)}
function init(){
 if(slug==='password-generator'){ui(`<label>Length<input id=len type=number value=20></label><label><input id=sym type=checkbox checked> include symbols</label><button onclick=run()>Generate</button><button class=secondary onclick=copy()>Copy</button>`,`<div id=out class=result></div>`); run=()=>{let chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'+($('sym').checked?'!@#$%^&*_-+=':'');let a=new Uint32Array(+$('len').value);crypto.getRandomValues(a);$('out').textContent=[...a].map(x=>chars[x%chars.length]).join('')};run()}
 if(slug==='color-palette'){ui(`<label>Base<input id=base type=color value=#7c5cff></label><button onclick=run()>Build</button>`,`<div id=out class=grid></div><pre id=cssout class=result></pre>`); run=()=>{let h=$('base').value, r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5),16),vars=[];$('out').innerHTML='';[.85,.65,.45,.2,0,-.18,-.35,-.52].forEach((t,i)=>{let mix=t>=0?[255,255,255]:[0,0,0],u=Math.abs(t),c=[r,g,b].map((v,j)=>Math.round(v+(mix[j]-v)*u)),x='#'+c.map(n=>n.toString(16).padStart(2,'0')).join('');vars.push(`--shade-${i+1}: ${x};`);$('out').innerHTML+=`<div class="card third"><div class=swatch style="background:${x}">${x}</div></div>`});$('cssout').textContent=':root {\n  '+vars.join('\n  ')+'\n}'};run()}
 if(slug==='json-formatter'){ui(`<textarea id=txt>{"hello":"world","items":[1,2,3]}</textarea><button onclick=pretty()>Pretty</button><button class=secondary onclick=mini()>Minify</button>`,`<pre id=out class=result></pre>`); pretty=()=>{try{$('out').textContent=JSON.stringify(JSON.parse($('txt').value),null,2)}catch(e){$('out').textContent=e.message}}; mini=()=>{try{$('out').textContent=JSON.stringify(JSON.parse($('txt').value))}catch(e){$('out').textContent=e.message}};pretty()}
 if(slug==='markdown-preview'){ui(`<textarea id=txt oninput=run()># Heading\n\n- item\n- item\n\n**bold** and \`code\`</textarea>`,`<div id=out class=preview></div>`); run=()=>{$('out').innerHTML=esc($('txt').value).replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\n/g,'<br>')};run()}
 if(slug==='unit-converter'){ui(`<label>Value<input id=v type=number value=1 oninput=run()></label><label>From<select id=f onchange=run()></select></label><label>To<select id=t onchange=run()></select></label>`,`<div id=out class=kpi></div>`); let u={m:1,km:1000,cm:.01,inch:.0254,ft:.3048,mi:1609.344,kg:1,g:.001,lb:.453592,oz:.0283495}; Object.keys(u).forEach(k=>{$('f').innerHTML+=`<option>${k}</option>`;$('t').innerHTML+=`<option>${k}</option>`});$('t').value='ft'; run=()=>{$('out').textContent=((+$('v').value*u[$('f').value]/u[$('t').value]).toFixed(6)).replace(/0+$/,'')+' '+$('t').value};run()}
 if(slug==='time-zone-planner'){ui(`<label>Date/time<input id=dt type=datetime-local onchange=run()></label><button onclick=now()>Use now</button>`,`<table><tbody id=out></tbody></table>`); let zones=['UTC','America/Los_Angeles','America/New_York','Europe/London','Asia/Dubai','Asia/Kolkata','Asia/Tokyo','Australia/Sydney']; now=()=>{let d=new Date;d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('dt').value=d.toISOString().slice(0,16);run()}; run=()=>{let d=new Date($('dt').value);$('out').innerHTML=zones.map(z=>`<tr><td>${z}</td><td>${new Intl.DateTimeFormat('en',{timeZone:z,dateStyle:'medium',timeStyle:'short'}).format(d)}</td></tr>`).join('')};now()}
 if(slug==='pomodoro-timer'){ui(`<label>Minutes<input id=min type=number value=25></label><button onclick=start()>Start/Pause</button><button class=secondary onclick=reset()>Reset</button>`,`<div id=out class=kpi></div>`); let left,t; reset=()=>{left=+$('min').value*60;$('out').textContent=fmt(left);clearInterval(t);t=null}; fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); start=()=>{if(t){clearInterval(t);t=null}else t=setInterval(()=>{$('out').textContent=fmt(Math.max(0,--left)); if(left<=0)clearInterval(t)},1000)};reset()}
 if(slug==='expense-splitter'){ui(`<label>Total<input id=total type=number value=120></label><label>Tip %<input id=tip type=number value=18></label><label>People<input id=people type=number value=4></label><button onclick=run()>Calculate</button>`,`<div id=out class=result></div>`); run=()=>{let sub=+$('total').value, tip=sub*+$('tip').value/100, grand=sub+tip, each=grand/+$('people').value;$('out').textContent=`Subtotal: $${sub.toFixed(2)}\nTip: $${tip.toFixed(2)}\nTotal: $${grand.toFixed(2)}\nEach: $${each.toFixed(2)}`};run()}
 if(slug==='habit-tracker'){ui(`<input id=name placeholder="New habit"><button onclick=add()>Add</button><button class=secondary onclick="localStorage.habits='[]';draw()">Clear</button>`,`<div id=out></div>`); let days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun']; add=()=>{let a=JSON.parse(localStorage.habits||'[]'); if($('name').value)a.push({n:$('name').value,c:{}});localStorage.habits=JSON.stringify(a);$('name').value='';draw()}; tog=(i,d)=>{let a=JSON.parse(localStorage.habits||'[]');a[i].c[d]=!a[i].c[d];localStorage.habits=JSON.stringify(a);draw()}; draw=()=>{let a=JSON.parse(localStorage.habits||'[]');$('out').innerHTML=a.map((h,i)=>`<div class=card><b>${esc(h.n)}</b><br>`+days.map(d=>`<button class=${h.c[d]?'':'secondary'} onclick="tog(${i},'${d}')">${d}${h.c[d]?' ✓':''}</button>`).join('')+'</div>').join('')||'No habits yet.'};draw()}
 if(slug==='invoice-maker'){ui(`<label>Business<input id=biz value="Studio LLC"></label><label>Client<input id=client value="Acme Co"></label><label>Items: description, qty, price<textarea id=items>Design, 10, 75\nHosting, 1, 20</textarea></label><button onclick=run()>Preview</button><button class=secondary onclick=print()>Print</button>`,`<div id=out class=preview></div>`); run=()=>{let total=0, rows=$('items').value.split('\n').filter(Boolean).map(l=>l.split(',').map(s=>s.trim()));$('out').innerHTML=`<h1>Invoice</h1><p><b>${esc($('biz').value)}</b> → ${esc($('client').value)}</p><table>`+rows.map(r=>{let t=(+r[1])*(+r[2]);total+=t;return`<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>$${(+r[2]).toFixed(2)}</td><td>$${t.toFixed(2)}</td></tr>`}).join('')+`</table><h2>Total $${total.toFixed(2)}</h2>`};run()}
 if(slug==='text-counter'){ui(`<textarea id=txt oninput=run()>Paste text here to analyze it.</textarea>`,`<div id=out class=result></div>`); run=()=>{let s=$('txt').value,w=s.match(/[\w']+/g)||[];$('out').textContent=`Words: ${w.length}\nCharacters: ${s.length}\nSentences: ${(s.match(/[.!?]/g)||[]).length}\nReading time: ${Math.max(1,Math.ceil(w.length/220))} min`};run()}
 if(slug==='regex-tester'){ui(`<label>Pattern<input id=pat value="\\b\\w{5}\\b"></label><label>Flags<input id=flags value=gi></label><textarea id=txt>Find useful words here.</textarea><button onclick=run()>Test</button>`,`<div id=out class=result></div>`); run=()=>{try{let r=new RegExp($('pat').value,$('flags').value);$('out').textContent=[...$('txt').value.matchAll(r)].map(m=>`[${m.index}] ${m[0]}`).join('\n')||'No matches'}catch(e){$('out').textContent=e.message}};run()}
 if(slug==='diff-viewer'){ui(`<textarea id=a>line one\nline two</textarea><textarea id=b>line one\nline 2\nline three</textarea><button onclick=run()>Compare</button>`,`<pre id=out class=result></pre>`); run=()=>{let A=$('a').value.split('\n'),B=$('b').value.split('\n'),n=Math.max(A.length,B.length),s='';for(let i=0;i<n;i++)s+=A[i]===B[i]?'  '+(A[i]||'')+'\n':(A[i]!=null?'- '+A[i]+'\n':'')+(B[i]!=null?'+ '+B[i]+'\n':'');$('out').textContent=s};run()}
 if(slug==='favicon-maker'){ui(`<label>Letters<input id=letters value=MS maxlength=3 oninput=run()></label><label>Background<input id=bg type=color value=#7c5cff oninput=run()></label><button onclick=down()>Download</button>`,`<canvas id=c width=256 height=256></canvas>`); let ctx=$('c').getContext('2d'); run=()=>{ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,256,256);ctx.fillStyle='white';ctx.font='bold 92px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText($('letters').value,128,136)}; down=()=>{let a=document.createElement('a');a.href=$('c').toDataURL();a.download='favicon.png';a.click()};run()}
 if(slug==='meta-tag-builder'){ui(`<label>Title<input id=title value="My Page" oninput=run()></label><label>Description<textarea id=desc oninput=run()>A useful page.</textarea></label><label>URL<input id=url value=https://example.com oninput=run()></label>`,`<pre id=out class=result></pre><button onclick=copy()>Copy</button>`); run=()=>{$('out').textContent=`<title>${$('title').value}</title>\n<meta name="description" content="${$('desc').value}">\n<meta property="og:title" content="${$('title').value}">\n<meta property="og:description" content="${$('desc').value}">\n<meta property="og:url" content="${$('url').value}">`};run()}
 if(slug==='svg-wave-generator'){ui(`<label>Amplitude<input id=amp type=range min=10 max=110 value=55 oninput=run()></label><label>Color<input id=col type=color value=#21d4a3 oninput=run()></label>`,`<div id=prev></div><pre id=out class=result></pre>`); run=()=>{let A=+$('amp').value,d=`M0 100 C200 ${100-A},300 ${100+A},500 100 S800 ${100-A},1000 100 V220 H0 Z`,svg=`<svg viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg"><path fill="${$('col').value}" d="${d}"/></svg>`;$('prev').innerHTML=svg;$('out').textContent=svg};run()}
 if(slug==='css-gradient-builder'){ui(`<label>Color 1<input id=c1 type=color value=#7c5cff oninput=run()></label><label>Color 2<input id=c2 type=color value=#21d4a3 oninput=run()></label><label>Angle<input id=ang type=range min=0 max=360 value=135 oninput=run()></label>`,`<div id=box class=swatch style="height:240px"></div><pre id=out class=result></pre>`); run=()=>{let g=`linear-gradient(${$('ang').value}deg, ${$('c1').value}, ${$('c2').value})`;$('box').style.background=g;$('box').textContent=g;$('out').textContent=`background: ${g};`};run()}
 if(slug==='robots-txt-builder'){ui(`<label>Sitemap<input id=site value=https://example.com/sitemap.xml oninput=run()></label><label>Disallow paths<textarea id=paths oninput=run()>/admin\n/private</textarea></label>`,`<pre id=out class=result></pre><button onclick=copy()>Copy</button>`); run=()=>{$('out').textContent='User-agent: *\nAllow: /\n'+$('paths').value.split('\n').filter(Boolean).map(p=>'Disallow: '+p).join('\n')+'\nSitemap: '+$('site').value};run()}
 if(slug==='sitemap-builder'){ui(`<label>URLs<textarea id=urls oninput=run()>https://example.com/\nhttps://example.com/about</textarea></label><label>Lastmod<input id=last type=date onchange=run()></label>`,`<pre id=out class=result></pre><button onclick=copy()>Copy</button>`);$('last').value=new Date().toISOString().slice(0,10); run=()=>{$('out').textContent='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+$('urls').value.split('\n').filter(Boolean).map(u=>`  <url><loc>${esc(u)}</loc><lastmod>${$('last').value}</lastmod></url>`).join('\n')+'\n</urlset>'};run()}
 if(slug==='business-card-maker'){ui(`<label>Name<input id=name value="Mehrzad Samadi" oninput=run()></label><label>Role<input id=role value="Builder" oninput=run()></label><label>Email<input id=email value=hello@example.com oninput=run()></label><label>Accent<input id=accent type=color value=#7c5cff oninput=run()></label><button onclick=print()>Print</button>`,`<div id=out class=preview></div>`); run=()=>{$('out').innerHTML=`<div style="border-radius:24px;padding:34px;min-height:220px;color:white;background:linear-gradient(135deg,${$('accent').value},#111831);display:flex;flex-direction:column;justify-content:space-between"><div><h1 style="color:white;margin:0">${esc($('name').value)}</h1><p>${esc($('role').value)}</p></div><p>${esc($('email').value)}<br>web · projects · contact</p></div>`};run()}
}
function ui(left,right){document.querySelector('#left').innerHTML=left;document.querySelector('#right').innerHTML=right}
let run=()=>{}, pretty, mini, now, start, reset, add, tog, draw, down; init();
</script></body></html>
